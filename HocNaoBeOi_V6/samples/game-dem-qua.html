<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bé đếm quả · Game kết nối mẫu</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:linear-gradient(120deg,#e5f7ff,#fff0f8);font:20px Arial,sans-serif;color:#244577;text-align:center}main{max-width:660px;margin:auto;background:#ffffffd9;padding:25px;border-radius:25px;border:3px solid white}h1{font-size:30px}#fruit{font-size:55px;margin:25px 0}button{background:#ff4a96;color:white;border:3px solid white;padding:17px 25px;border-radius:18px;font:700 28px Arial;cursor:pointer;box-shadow:0 5px 13px #ff4a9630;margin:5px}button:disabled{opacity:.6}p{line-height:1.6}small{font-size:15px;color:#6c85a6}</style><main><h1>🍎 Bé đếm quả</h1><p id="question">Bé đếm xem có mấy quả nào?</p><div id="fruit"></div><div id="options"></div><p id="info"></p><small>Game HTML mẫu · Kết nối kết quả với Học nào bé ơi!</small></main><script>
let nonce='',preview=true,index=0,correct=0,finished=false;
const questions=[{fruit:'🍎 🍎 🍎',count:3,options:[2,3,4]},{fruit:'🍊 🍊',count:2,options:[1,2,3]},{fruit:'🍓 🍓 🍓 🍓',count:4,options:[3,4,5]}];
window.addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.type!=='hocnaobeoi:init')return;nonce=String(e.data.nonce||'');preview=!!e.data.preview;if(finished)send()});
function send(){if(!preview&&nonce)parent.postMessage({type:'hocnaobeoi:result',nonce,correct,total:questions.length},'*')}
function draw(){const q=questions[index];document.querySelector('#question').textContent='Bé đếm xem có mấy quả nào?';document.querySelector('#fruit').textContent=q.fruit;document.querySelector('#options').replaceChildren(...q.options.map(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(x===q.count)correct++;index++;if(index<questions.length)draw();else{finished=true;document.querySelector('#fruit').textContent='🎉 🌟 🎈';document.querySelector('#question').textContent='Bé đã hoàn thành rồi!';document.querySelector('#options').textContent=correct+'/'+questions.length+' câu đúng';document.querySelector('#info').textContent=preview?'Đây là lượt chơi thử.':'Kết quả đã được gửi về hệ thống, chờ cô xác nhận.';send()}};return b}));document.querySelector('#info').textContent='Câu '+(index+1)+'/'+questions.length}
draw();parent.postMessage({type:'hocnaobeoi:ready'},'*');
</script></html>
